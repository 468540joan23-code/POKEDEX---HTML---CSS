<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex: Rayquaza</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="pokemon-header">
            <h1 class="pokemon-name">Rayquaza</h1>
            <div class="pokemon-image-container">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/384.png" alt="Rayquaza" class="pokemon-main-image">
            </div>
            <p class="pokemon-number">Nº 384</p>
        </header>

        <section class="evolutions-section">
            <h2 class="section-title">Formas</h2>
            <div class="evolution-chain">
                <div class="evolution-stage">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/384.png" alt="Rayquaza" class="evolution-image">
                    <p>Rayquaza</p>
                </div>
                
                <span class="arrow">➤</span>

                <div class="evolution-stage current">
                    <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/384.png" alt="Mega Rayquaza" class="evolution-image">
                    <p>Mega Rayquaza</p>
                </div>
            </div>
        </section>

        <section class="pokemon-details">
            <h2 class="section-title">Detalles</h2>
            <div class="details-content">
                <p class="description">
                    Rayquaza es un Pokémon legendario de tipo Dragón/Volador. 
                    Habita en la capa de ozono y puso fin a la lucha entre Kyogre y Groudon.
                </p>
                <ul class="stats-list">
                    <li><strong>TIPO:</strong> <span class="tag">DRAGÓN</span> <span class="tag">VOLADOR</span></li>
                    <li><strong>ALTURA:</strong> 7.0 m</li>
                    <li><strong>PESO:</strong> 206.5 kg</li>
                    <li><strong>HABILIDAD:</strong> Bucle Aire</li>
                </ul>
            </div>
        </section>
    </div>
</body>
</html>
